<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conteo Navideño Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Bloqueo total de scroll y recargas táctiles indeseadas */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none; 
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to bottom, #a1c4fd 0%, #e0f6ff 60%, #ffffff 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: #1e3a8a;
            touch-action: none; 
            position: relative;
        }
        
        .xmas-font {
            font-family: 'Great Vibes', cursive;
        }

        /* Snowflake Animation */
        .snow {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) scale(1.5); opacity: 0; }
        }

        /* Glassmorphism for countdown */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        /* Draggable elements */
        .draggable {
            position: absolute;
            cursor: grab;
            font-size: 2.5rem; 
            user-select: none;
            -webkit-user-select: none;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.1s;
            z-index: 10;
        }
        
        .draggable:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        /* Botón de Música Minimalista */
        #music-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 50;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #dc2626; 
            transition: transform 0.3s ease;
        }
        #music-btn:active {
            transform: scale(0.9);
        }
        #music-btn.playing {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
