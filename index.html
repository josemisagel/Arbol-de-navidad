<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conteo Navideño Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; /* Prevent scrolling to keep it like an app */
            background: linear-gradient(to bottom, #a1c4fd 0%, #e0f6ff 60%, #ffffff 100%);
            color: #1e3a8a;
            touch-action: none; /* Crucial for custom touch events */
            position: relative;
        }
        
        .xmas-font {
            font-family: 'Mountains of Christmas', cursive;
        }

        /* Snowflake Animation */
        .snow {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-10vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) scale(1.5); opacity: 0; }
        }

        /* Glassmorphism for countdown */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        /* Draggable elements */
        .draggable {
            position: absolute;
            cursor: grab;
            font-size: 2.5rem; /* Slightly smaller to fit on the tree */
            user-select: none;
            -webkit-user-select: none;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.1s;
            z-index: 10;
        }
        
        .draggable:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        #music-btn {
            transition: all 0.3s ease;
        }
        #music-btn.playing {
            animation: pulse 2s infinite;
            background-color: #10b981; /* Green */
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="h-screen w-screen relative">

    <!-- Snow container -->
    <div id="snow-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- Main UI -->
    <div class="relative z-10 flex flex-col items-center justify-start pt-10 h-full w-full p-4 pointer-events-none">
        
        <!-- Header -->
        <div class="text-center mb-4 glass-panel p-6 rounded-3xl pointer-events-auto">
            <h1 class="text-5xl md:text-6xl text-red-600 xmas-font mb-2 drop-shadow-md tracking-wider">¡Feliz Navidad!</h1>
            <p class="text-xl md:text-2xl text-blue-900 font-bold">Faltan:</p>
            
            <!-- Countdown -->
            <div class="flex gap-2 md:gap-4 mt-4 justify-center">
                <div class="flex flex-col items-center glass-panel px-3 py-2 md:px-5 md:py-4 rounded-xl">
                    <span id="days" class="text-3xl md:text-5xl font-bold text-blue-900">00</span>
                    <span class="text-xs md:text-sm text-blue-800 uppercase mt-1">Días</span>
                </div>
                <div class="text-2xl md:text-4xl font-bold text-blue-900 self-start mt-2">:</div>
                <div class="flex flex-col items-center glass-panel px-3 py-2 md:px-5 md:py-4 rounded-xl">
                    <span id="hours" class="text-3xl md:text-5xl font-bold text-blue-900">00</span>
                    <span class="text-xs md:text-sm text-blue-800 uppercase mt-1">Horas</span>
                </div>
                <div class="text-2xl md:text-4xl font-bold text-blue-900 self-start mt-2">:</div>
                <div class="flex flex-col items-center glass-panel px-3 py-2 md:px-5 md:py-4 rounded-xl">
                    <span id="minutes" class="text-3xl md:text-5xl font-bold text-blue-900">00</span>
                    <span class="text-xs md:text-sm text-blue-800 uppercase mt-1">Min</span>
                </div>
                <div class="text-2xl md:text-4xl font-bold text-blue-900 self-start mt-2">:</div>
                <div class="flex flex-col items-center glass-panel px-3 py-2 md:px-5 md:py-4 rounded-xl">
                    <span id="seconds" class="text-3xl md:text-5xl font-bold text-blue-900">00</span>
                    <span class="text-xs md:text-sm text-blue-800 uppercase mt-1">Seg</span>
                </div>
            </div>
        </div>

        <!-- Instructions -->
        <p class="text-sm text-blue-900 font-bold text-center glass-panel px-4 py-2 rounded-full pointer-events-auto shadow-md">
            👆 Arrastra las decoraciones al gran árbol
        </p>
    </div>

    <!-- Giant Background Tree -->
    <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 z-[1] select-none pointer-events-none drop-shadow-2xl" style="font-size: 625px; line-height: 1;">
        🎄
    </div>

    <!-- Music Control -->
    <button id="music-btn" class="absolute top-6 right-6 z-50 glass-panel bg-red-600 hover:bg-red-500 text-white p-4 rounded-full shadow-xl flex items-center justify-center touch-manipulation text-2xl">
        <span id="play-icon">🎵</span>
        <span id="pause-icon" class="hidden">⏸️</span>
    </button>

    <!-- Draggable Decorations (Scattered on the sides) -->
    <!-- Left side -->
    <div class="draggable" style="top: 15%; left: 5%;">🎁</div>
    <div class="draggable" style="top: 25%; left: 10%;">🌟</div>
    <div class="draggable" style="top: 35%; left: 5%;">🔔</div>
    <div class="draggable" style="top: 45%; left: 12%;">🍬</div>
    <div class="draggable" style="top: 55%; left: 8%;">🎀</div>
    <div class="draggable" style="top: 65%; left: 15%;">🦌</div>
    <div class="draggable" style="top: 75%; left: 5%;">🎅</div>
    <div class="draggable" style="top: 85%; left: 10%;">🎁</div>
    <div class="draggable" style="top: 30%; left: 20%;">❄️</div>
    <div class="draggable" style="top: 70%; left: 22%;">🕯️</div>
    <div class="draggable" style="top: 88%; left: 25%;">🧸</div>
    
    <!-- Right side -->
    <div class="draggable" style="top: 15%; left: 85%;">🎁</div>
    <div class="draggable" style="top: 25%; left: 80%;">🌟</div>
    <div class="draggable" style="top: 35%; left: 88%;">🔔</div>
    <div class="draggable" style="top: 45%; left: 78%;">🍬</div>
    <div class="draggable" style="top: 55%; left: 85%;">🎀</div>
    <div class="draggable" style="top: 65%; left: 75%;">🦌</div>
    <div class="draggable" style="top: 75%; left: 88%;">🎅</div>
    <div class="draggable" style="top: 85%; left: 80%;">🎁</div>
    <div class="draggable" style="top: 30%; left: 70%;">❄️</div>
    <div class="draggable" style="top: 70%; left: 68%;">🕯️</div>
    <div class="draggable" style="top: 10%; left: 45%;">⭐</div>
    <div class="draggable" style="top: 88%; left: 65%;">🧸</div>

    <script>
        // --- 1. COUNTDOWN LOGIC ---
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            // Target is Christmas of the current year
            let targetDate = new Date(`December 25, ${currentYear} 00:00:00`);
            
            // If Christmas has passed this year, target next year
            if (now > targetDate) {
                targetDate = new Date(`December 25, ${currentYear + 1} 00:00:00`);
            }

            const diff = targetDate - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            // Format with leading zeros
            document.getElementById('days').innerText = days.toString().padStart(2, '0');
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
        }
        
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- 2. SNOW ANIMATION ---
        function createSnowflakes() {
            const container = document.getElementById('snow-container');
            const numFlakes = 50;
            
            for (let i = 0; i < numFlakes; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snow');
                
                // Random properties
                const size = Math.random() * 4 + 2; // 2px to 6px
                const left = Math.random() * 100; // 0% to 100%
                const duration = Math.random() * 10 + 5; // 5s to 15s
                const delay = Math.random() * -15; // Start at random times
                
                flake.style.width = `${size}px`;
                flake.style.height = `${size}px`;
                flake.style.left = `${left}%`;
                flake.style.animationDuration = `${duration}s`;
                flake.style.animationDelay = `${delay}s`;
                
                container.appendChild(flake);
            }
        }
        createSnowflakes();

        // --- 3. DRAG AND DROP (TOUCH & MOUSE COMPATIBLE) ---
        const draggables = document.querySelectorAll('.draggable');
        
        let activeItem = null;
        let initialX, initialY, currentX, currentY;
        let xOffset = 0, yOffset = 0;

        draggables.forEach(item => {
            // Initialize data offsets to 0
            item.dataset.xOffset = 0;
            item.dataset.yOffset = 0;

            // Touch events
            item.addEventListener('touchstart', dragStart, { passive: false });
            item.addEventListener('touchend', dragEnd, false);
            item.addEventListener('touchmove', drag, { passive: false });

            // Mouse events
            item.addEventListener('mousedown', dragStart, false);
            document.addEventListener('mouseup', dragEnd, false);
            document.addEventListener('mousemove', drag, false);
        });

        function dragStart(e) {
            // Check if the target is one of our draggables
            if (!e.target.classList.contains('draggable')) return;
            
            activeItem = e.target;
            
            // Bring to front
            draggables.forEach(d => d.style.zIndex = 10);
            activeItem.style.zIndex = 100;

            // Get current offsets from data attributes
            xOffset = parseFloat(activeItem.dataset.xOffset);
            yOffset = parseFloat(activeItem.dataset.yOffset);

            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
        }

        function drag(e) {
            if (activeItem) {
                e.preventDefault(); // Prevent scrolling on touch devices while dragging

                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                // Update data attributes
                activeItem.dataset.xOffset = currentX;
                activeItem.dataset.yOffset = currentY;

                setTranslate(currentX, currentY, activeItem);
            }
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0) scale(1.1)`;
        }

        function dragEnd(e) {
            if (activeItem) {
                activeItem.style.transform = `translate3d(${activeItem.dataset.xOffset}px, ${activeItem.dataset.yOffset}px, 0) scale(1)`;
                activeItem = null;
            }
        }

        // --- 4. TONE.JS CHRISTMAS MUSIC (Jingle Bells) ---
        let isPlaying = false;
        let synth;
        let sequence;

        const musicBtn = document.getElementById('music-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');

        async function initAudio() {
            await Tone.start();
            
            // Create a cheerful, upbeat synthesizer without the dark reverb
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: {
                    attack: 0.05,
                    decay: 0.2,
                    sustain: 0.2,
                    release: 0.5
                }
            }).toDestination();
            
            synth.volume.value = -2;

            // Jingle Bells (Upbeat and Fast)
            const melody = [
                { time: "0:0", note: "E5", duration: "8n" },
                { time: "0:1", note: "E5", duration: "8n" },
                { time: "0:2", note: "E5", duration: "4n" },
                
                { time: "1:0", note: "E5", duration: "8n" },
                { time: "1:1", note: "E5", duration: "8n" },
                { time: "1:2", note: "E5", duration: "4n" },
                
                { time: "2:0", note: "E5", duration: "8n" },
                { time: "2:1", note: "G5", duration: "8n" },
                { time: "2:2", note: "C5", duration: "4n" },
                { time: "2:3.5", note: "D5", duration: "16n" },
                
                { time: "3:0", note: "E5", duration: "2n" },
                
                { time: "4:0", note: "F5", duration: "8n" },
                { time: "4:1", note: "F5", duration: "8n" },
                { time: "4:2", note: "F5", duration: "4n" },
                { time: "4:3.5", note: "F5", duration: "16n" },
                
                { time: "5:0", note: "F5", duration: "8n" },
                { time: "5:1", note: "E5", duration: "8n" },
                { time: "5:2", note: "E5", duration: "8n" },
                { time: "5:3", note: "E5", duration: "16n" },
                { time: "5:3.5", note: "E5", duration: "16n" },
                
                { time: "6:0", note: "E5", duration: "8n" },
                { time: "6:1", note: "D5", duration: "8n" },
                { time: "6:2", note: "D5", duration: "8n" },
                { time: "6:3", note: "E5", duration: "8n" },
                
                { time: "7:0", note: "D5", duration: "4n" },
                { time: "7:2", note: "G5", duration: "4n" }
            ];

            const part = new Tone.Part((time, value) => {
                synth.triggerAttackRelease(value.note, value.duration, time);
            }, melody).start(0);

            part.loop = true;
            part.loopEnd = "8:0:0"; // Loop every 8 measures
            Tone.Transport.bpm.value = 160; // High BPM for cheerful mood!
        }

        musicBtn.addEventListener('click', async () => {
            if (!synth) {
                await initAudio();
            }

            isPlaying = !isPlaying;

            if (isPlaying) {
                Tone.Transport.start();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                musicBtn.classList.add('playing');
                musicBtn.classList.replace('bg-red-600', 'bg-green-500');
                musicBtn.classList.replace('hover:bg-red-500', 'hover:bg-green-400');
            } else {
                Tone.Transport.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                musicBtn.classList.remove('playing');
                musicBtn.classList.replace('bg-green-500', 'bg-red-600');
                musicBtn.classList.replace('hover:bg-green-400', 'hover:bg-red-500');
            }
        });

    </script>
</body>
</html>
